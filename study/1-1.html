<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PDF Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: '맑은 고딕', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        #pdf-viewer {
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            border: 1px solid #000;
            overflow: auto;
            background-color: #fff;
        }
        canvas {
            display: block;
            margin: 10px auto;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="pdf-viewer"></div>
    <!-- PDF.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>
        const url = '1-1.pdf';

        // PDF.js 라이브러리 로드
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        // PDF 파일 로드 및 페이지 렌더링
        pdfjsLib.getDocument(url).promise.then(function(pdfDoc) {
            const viewer = document.getElementById('pdf-viewer');

            const renderPage = function(pageNum) {
                pdfDoc.getPage(pageNum).then(function(page) {
                    const viewport = page.getViewport({ scale: 1 });
                    const scale = viewer.clientWidth / viewport.width; // Adjusting scale to fit the viewer width
                    const scaledViewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = scaledViewport.height;
                    canvas.width = scaledViewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: scaledViewport
                    };

                    page.render(renderContext).promise.then(function() {
                        viewer.appendChild(canvas);
                        if (pageNum < pdfDoc.numPages) {
                            renderPage(pageNum + 1);
                        }
                    });
                });
            };

            renderPage(1);

            // Adjust scale on window resize
            window.addEventListener('resize', function() {
                viewer.innerHTML = ''; // Clear the viewer
                renderPage(1); // Re-render the pages
            });
        });
    </script>
</body>
</html>
